{% set name = "researchpy" %}
{% set version = "0.3.7.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/researchpy-{{ version }}.tar.gz
  sha256: 32ccea27754d0caa2f8ae03f603cedb82976d9d75bb9fa425efb9b9986b69225

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0
    - pip
  run:
    - python >={{ python_min }}
    - scipy
    - numpy
    - pandas
    - statsmodels
    - patsy

test:
  imports:
    - researchpy
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/researchpy/researchpy
  summary: Researchpy produces Pandas DataFrames that contain relevant statistical testing information that is commonly required for academic research.
  license: BSD-3-Clause
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - rxm7706
